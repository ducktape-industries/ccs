[package]
name = "ccs"
version = "0.1.0"
edition = "2024"
description = "Claude Code and Codex account switcher with subscription usage tracking"
license = "MIT"
repository = "https://github.com/orthory/ccs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
jiff = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

# The app beside the binary: one workspace, one lock file, one `target/`.
[workspace]
members = ["app"]

[profile.release]
opt-level = "z"
lto = true
strip = true
