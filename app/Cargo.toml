[package]
name = "ccs-app"
version = "0.1.0"
edition = "2024"
description = "ccs in a window, and on the menu bar where there is one"
license = "MIT"
publish = false

[[bin]]
name = "ccs-app"
path = "src/main.rs"

[dependencies]
ccs = { path = ".." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2"
notify-rust = "4"
futures = "0.3"
gpui-kit = "=0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow"] }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
gpui-kit = { version = "=0.6.1", features = ["test-support"] }
